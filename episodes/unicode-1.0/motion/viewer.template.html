<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>유니코드 초판 · 스캔의 흔적</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeefeb;color:#20231f;font:16px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:1280px;margin:2.8vh auto;padding:0 2vw}canvas{display:block;width:100%;height:auto;background:#fafaf8;box-shadow:0 1px 12px #25262114}nav,section{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;border:1px solid #bbbeb4;background:transparent;color:inherit;border-radius:4px;cursor:pointer;padding:.55em .9em}button[aria-pressed=true]{color:#fff;background:#343930}input{min-width:100px;flex:1;accent-color:#485040}output{font:14px Menlo,monospace}a{color:#4b5049}footer{font-size:13px;margin:16px 0}button:focus-visible,input:focus-visible{outline:3px solid #606f8f}
</style><main><canvas id="stage" width="1280" height="720" aria-label="유니코드 초판 인쇄 조각의 움직임"></canvas>
<nav aria-label="장면"><button data-mode="mapping">세 나라의 문자표</button><button data-mode="grid">76행 73열</button><button data-mode="forms">두 개의 푸를 청</button><button data-mode="grain">한 획의 오른쪽 끝</button></nav>
<section aria-label="재생"><button id="play">재생</button><input id="seek" type="range" min="0" value="0" step=".01" aria-label="재생 위치"><output id="timer">0:00</output><button id="compare" aria-pressed="false">원본 대조</button></section>
<footer>유니코드 표준 1.0 제2권 · <a href="https://www.unicode.org/versions/Unicode1.0.0/HanCharts2.pdf#page=3">171쪽 대조표</a> · <a href="https://www.unicode.org/versions/Unicode1.0.0/HanCharts1.pdf#page=76">98쪽 문자표</a></footer></main>
